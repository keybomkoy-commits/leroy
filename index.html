<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leroy</title>
    <link rel="icon" id="siteFavicon" href="">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes pageFadeIn {
            0% { opacity: 0; filter: blur(8px); transform: scale(1.02); }
            100% { opacity: 1; filter: blur(0); transform: scale(1); }
        }

        body {
            margin: 0; padding: 0; height: 100vh; width: 100vw;
            font-family: 'Inter', sans-serif; background-color: #030305; color: #ffffff;
            overflow: hidden; display: flex; flex-direction: column;
            -webkit-font-smoothing: antialiased;
            animation: pageFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        #bg-image {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            z-index: 0; will-change: transform;
            animation: bgZoom 50s cubic-bezier(0.37, 0, 0.63, 1) infinite alternate;
        }
        @keyframes bgZoom { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

        .bg-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(3, 3, 5, 0.85) 0%, rgba(10, 10, 18, 0.75) 100%);
            z-index: 1; pointer-events: none;
        }

        #particleCanvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2; pointer-events: none;
        }

        /* ----- เลย์เอาต์หลักจัดกลุ่มให้สมดุล ----- */
        .main-content {
            position: relative; z-index: 3; flex: 1;
            display: flex; flex-direction: row; 
            justify-content: center; /* ดึงให้อยู่ตรงกลาง */
            align-items: center;
            padding: 40px 5%; box-sizing: border-box; 
            gap: clamp(40px, 8vw, 120px); /* เพิ่มช่องว่างระหว่างซ้าย-ขวาให้พอดี */
            width: 100%; max-width: 1400px; margin: 0 auto;
            overflow-y: auto;
        }

        .left-section {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: clamp(15px, 2.5vh, 25px); /* ลดช่องว่างภายในกลุ่มฝั่งซ้าย */
            width: 100%; max-width: 450px;
        }

        .right-section {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; max-width: 320px;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .emblem-container {
            position: relative; width: clamp(200px, 28vw, 320px); height: clamp(200px, 28vw, 320px);
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
            animation: logoFloat 5s ease-in-out infinite;
            will-change: transform;
        }

        .main-logo {
            width: 100%; height: 100%; object-fit: contain;
            filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.5)); z-index: 2;
            pointer-events: none;
        }

        .header-section { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; flex-shrink: 0; width: 100%; margin-bottom: 10px; }

        @keyframes titleBreath {
            0%, 100% { transform: scale(1); text-shadow: 0 0 20px rgba(255, 255, 255, 0.3); }
            50% { transform: scale(1.03); text-shadow: 0 0 45px rgba(255, 255, 255, 0.6); }
        }

        .main-title {
            font-family: 'Oswald', sans-serif; font-size: clamp(1.8rem, 4vw, 2.5rem);
            letter-spacing: 0.25em; margin: 0; font-weight: 700; text-transform: uppercase; color: #ffffff;
            animation: titleBreath 4s ease-in-out infinite;
            will-change: transform;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .dark-divider {
            display: flex; align-items: center; justify-content: center; gap: 14px; color: #999;
            font-size: clamp(0.6rem, 1vw, 0.75rem); letter-spacing: 0.4em; text-transform: uppercase; font-weight: 600; opacity: 0.9;
            width: 100%;
        }
        .dark-divider::before, .dark-divider::after {
            content: ''; width: clamp(40px, 8vw, 80px); height: 1.5px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        }

        .btn-container {
            display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 380px; z-index: 10;
        }

        /* ------------------ อนิเมชั่นปุ่ม MEMBERS ใหม่ ------------------ */
        @keyframes shineSweep {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .btn-members {
            width: 100%; text-decoration: none; 
            /* ไล่สีเทา-ขาว พร้อมเอฟเฟกต์สะท้อนแสงวิ่ง */
            background: linear-gradient(110deg, #e6e6e6 30%, #ffffff 50%, #e6e6e6 70%);
            background-size: 200% auto;
            border-radius: 50px; padding: clamp(16px, 2vh, 20px) 0;
            color: #030305;
            font-family: 'Inter', sans-serif; font-weight: 800; font-size: clamp(0.95rem, 1.5vw, 1.15rem);
            text-transform: uppercase; letter-spacing: 0.25em; 
            display: flex; justify-content: center; align-items: center; gap: 12px;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15), inset 0 -3px 5px rgba(0,0,0,0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            animation: shineSweep 4s linear infinite;
        }

        .btn-members:hover {
            transform: translateY(-5px) scale(1.02); 
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.4); 
            letter-spacing: 0.3em;
            color: #000;
        }

        /* ------------------ ปรับโครงสร้างปุ่ม PARTNER ------------------ */
        .partner-section-wrapper {
            display: flex; flex-direction: column; align-items: stretch; gap: 20px; width: 100%; z-index: 10;
            background: rgba(10, 10, 15, 0.5); /* เพิ่มพื้นหลังจางๆ ให้กลุ่ม Partner */
            backdrop-filter: blur(10px);
            padding: 25px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .partner-heading {
            font-family: 'Oswald', sans-serif; font-size: 0.85rem; letter-spacing: 0.35em; color: #aaaaaa; text-transform: uppercase; text-align: center;
            display: flex; align-items: center; gap: 10px;
        }
        
        .partner-heading::before, .partner-heading::after {
            content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.15);
        }
        
        .partner-buttons-group {
            display: flex; flex-direction: column; 
            justify-content: center; gap: 12px; width: 100%;
        }

        .partner-btn {
            text-decoration: none; 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 12px; 
            padding: 14px 20px;
            color: #dddddd; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 0.15em;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            text-align: center; width: 100%; box-sizing: border-box;
            position: relative; overflow: hidden; z-index: 1;
        }

        .partner-btn::before {
            content: ''; position: absolute; top: 0; left: 0; width: 0%; height: 100%;
            background: #ffffff; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); z-index: -1;
        }

        .partner-btn:hover {
            color: #030305; font-weight: 700; border-color: #ffffff;
            transform: translateX(5px); /* เลื่อนขวาเล็กน้อย */
            box-shadow: 5px 5px 20px rgba(255, 255, 255, 0.2);
        }

        .partner-btn:hover::before { width: 100%; }

        @media (max-width: 900px) {
            .main-content {
                flex-direction: column;
                justify-content: flex-start;
                padding: 40px 20px;
                gap: 40px;
            }
            .left-section, .right-section {
                max-width: 100%;
            }
            .right-section {
                max-width: 450px;
            }
        }

        /* ----- ส่วนควบคุมเพลง ----- */
        .music-widget {
            position: fixed; bottom: 20px; right: 20px; background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 14px;
            width: 280px; z-index: 99999; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        .music-widget.collapsed { height: 55px; }
        .music-widget.expanded { height: 110px; }
        .music-header { display: flex; align-items: center; padding: 8px 12px; height: 55px; box-sizing: border-box; cursor: pointer; }
        .cover-wrapper { position: relative; width: 34px; height: 34px; margin-right: 10px; flex-shrink: 0; }
        .music-cover {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 1.5px solid rgba(255, 255, 255, 0.3); animation: spinRecord 5s linear infinite; animation-play-state: paused;
        }
        .playing .music-cover { animation-play-state: running; border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.4); }
        @keyframes spinRecord { 100% { transform: rotate(360deg); } }

        .music-info-mini { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .music-label { font-size: 0.4rem; color: #888; letter-spacing: 0.2em; font-weight: 700; }
        .music-title { font-family: 'Oswald', sans-serif; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
        .music-link { font-size: 0.42rem; color: #777; text-decoration: none; }
        .toggle-icon { font-size: 0.48rem; color: #aaa; padding: 4px; transition: 0.3s; }
        .music-controls { display: flex; align-items: center; padding: 0 14px 10px 14px; gap: 12px; opacity: 0; transition: opacity 0.3s; border-top: 1px solid rgba(255,255,255,0.06); background: rgba(0,0,0,0.4); }
        .music-widget.expanded .music-controls { opacity: 1; }
        .ctrl-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }
        .vol-wrapper { flex: 1; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.04); padding: 2px 8px; border-radius: 6px; }
        .vol-slider { flex: 1; -webkit-appearance: none; height: 2px; background: rgba(255,255,255,0.2); outline: none; cursor: pointer; }
        .vol-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 8px; height: 8px; background: #fff; cursor: pointer; }

        /* ---------------- แถบเครดิตด้านล่าง ---------------- */
        .footer-credit {
            position: relative; z-index: 3; background: rgba(8, 8, 12, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 8px 24px; 
            margin: 0 auto 20px auto; width: max-content; max-width: 90%; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            font-size: 0.55rem; color: #888; letter-spacing: 0.35em; text-transform: uppercase; font-weight: 600;
            display: flex; justify-content: center; align-items: center; gap: 12px; flex-shrink: 0;
        }
        
        .footer-link-web { color: #aaaaaa; text-decoration: none; transition: 0.3s; }
        .footer-link-web:hover { color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.6); }
    </style>
</head>
<body>
    <div id="bg-image"></div>
    <div class="bg-overlay" id="bgOverlay"></div>
    <canvas id="particleCanvas"></canvas>

    <main class="main-content">
        <div class="left-section">
            <div class="emblem-container">
                <img id="mainLogo" src="" alt="Logo" class="main-logo" style="display: none;">
            </div>

            <header class="header-section">
                <h1 id="dynMainTitle" class="main-title">loading...</h1>
                <div class="dark-divider">
                    <span>●</span>
                    <span id="dynSubTitle">loading...</span>
                    <span>●</span>
                </div>
            </header>
            
            <div class="btn-container">
                <a href="member.html" class="btn-members">
                    <span>MEMBERS</span>
                    <span>›</span>
                </a>
            </div>
        </div>

        <div class="right-section">
            <div class="partner-section-wrapper" id="partnerSectionWrapper" style="display: none;">
                <div class="partner-heading">PARTNER</div>
                <div class="partner-buttons-group" id="partnerButtonsGroup"></div>
            </div>
        </div>
    </main>

    <div id="musicWidget" class="music-widget collapsed">
        <div class="music-header" id="toggleMusicBtn">
            <div class="cover-wrapper">
                <img id="musicCover" class="music-cover" src="https://placehold.co/100x100/111/444?text=🎵" alt="Cover">
            </div>
            <div class="music-info-mini">
                <span class="music-label">AUDIO STREAM</span>
                <div id="musicTitle" class="music-title">Unknown Track</div>
                <a id="musicLink" class="music-link" href="#" target="_blank">SOURCE LINK</a>
            </div>
            <div id="toggleIcon" class="toggle-icon">▲</div>
        </div>
        <div class="music-controls">
            <button id="playPauseBtn" class="ctrl-btn">▶</button>
            <div class="vol-wrapper">
                <span class="vol-icon" style="font-size:0.4rem; color:#aaa;">VOL</span>
                <input type="range" id="volumeSlider" class="vol-slider" min="0" max="1" step="0.01" value="0.2">
            </div>
        </div>
        <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    </div>

    <footer class="footer-credit">
        <span>SYSTEM DESIGN BY QA QEN</span>
        <span style="opacity: 0.3;">|</span>
        <a href="https://qaqenqcstudio.vercel.app" target="_blank" class="footer-link-web">คลิกเพื่อติดต่อทำเว็ป</a>
    </footer>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
        }
        window.addEventListener('resize', resizeCanvas); 
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width; 
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2; 
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.speedY = (Math.random() - 0.5) * 0.2; 
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.x += this.speedX; 
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width; if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height; if (this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`; 
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                ctx.fill();
            }
        }
        const particleCount = Math.floor((window.innerWidth * window.innerHeight) / 14000);
        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQs9obMhJdNNb7vPp69qzOOLs1OIsQYpI",
            authDomain: "leroy-ebc56.firebaseapp.com",
            projectId: "leroy-ebc56",
            storageBucket: "leroy-ebc56.firebasestorage.app",
            messagingSenderId: "644392545266",
            appId: "1:644392545266:web:c53222b8c438065f52196b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const audio = document.getElementById('bgMusic');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicWidget = document.getElementById('musicWidget');
        const toggleMusicBtn = document.getElementById('toggleMusicBtn');
        const toggleIcon = document.getElementById('toggleIcon');
        
        let isPlaying = false; 
        audio.volume = 0.2;
        volumeSlider.value = 0.2;

        const savedTime = sessionStorage.getItem('musicCurrentTime');
        const userStopped = sessionStorage.getItem('userStoppedMusic');
        if (savedTime) audio.currentTime = parseFloat(savedTime);

        if (userStopped !== 'true' && sessionStorage.getItem('musicIsPlaying') === 'true') {
            audio.play().then(() => { playPauseBtn.innerHTML = '❚❚'; musicWidget.classList.add('playing'); isPlaying = true; }).catch(e=>{});
        }

        window.addEventListener('beforeunload', () => {
            sessionStorage.setItem('musicCurrentTime', audio.currentTime);
            sessionStorage.setItem('musicIsPlaying', isPlaying);
        });

        document.body.addEventListener('click', (e) => {
            if (sessionStorage.getItem('userStoppedMusic') === 'true') return;
            if (!isPlaying && !e.target.closest('#playPauseBtn') && !e.target.closest('.vol-slider') && !e.target.closest('.music-widget')) {
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    isPlaying = true; 
                    sessionStorage.setItem('musicIsPlaying', 'true'); 
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{});
            }
        });

        playPauseBtn.addEventListener('click', () => {
            if (isPlaying) { 
                audio.pause(); 
                playPauseBtn.innerHTML = '▶'; 
                musicWidget.classList.remove('playing'); 
                sessionStorage.setItem('musicIsPlaying', 'false');
                sessionStorage.setItem('userStoppedMusic', 'true');
            } else { 
                audio.play().then(() => { 
                    playPauseBtn.innerHTML = '❚❚'; 
                    musicWidget.classList.add('playing'); 
                    sessionStorage.setItem('musicIsPlaying', 'true');
                    sessionStorage.setItem('userStoppedMusic', 'false');
                }).catch(e=>{}); 
            }
            isPlaying = !isPlaying;
        });

        volumeSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });
        toggleMusicBtn.addEventListener('click', (e) => {
            if (e.target.tagName.toLowerCase() === 'a') return;
            musicWidget.classList.toggle('collapsed');
            musicWidget.classList.toggle('expanded');
            toggleIcon.style.transform = musicWidget.classList.contains('expanded') ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        onSnapshot(doc(db, "settings", "homepage"), (docSnap) => {
            if (docSnap.exists()) {
                const cfg = docSnap.data();
                if (cfg.bgUrl) document.getElementById('bg-image').style.backgroundImage = `url('${cfg.bgUrl}')`;
                if (cfg.faviconUrl) document.getElementById('siteFavicon').href = cfg.faviconUrl;
                if (cfg.mainTitle) document.getElementById('dynMainTitle').innerText = cfg.mainTitle;
                if (cfg.subTitle) document.getElementById('dynSubTitle').innerText = cfg.subTitle;
                if (cfg.logoUrl) {
                    const logo = document.getElementById('mainLogo');
                    logo.src = cfg.logoUrl; logo.style.display = 'block';
                    if (cfg.logoWidth) logo.style.width = cfg.logoWidth;
                }
                if (cfg.musicTitle) document.getElementById('musicTitle').innerText = cfg.musicTitle;
                if (cfg.musicLinkText) document.getElementById('musicLink').innerText = cfg.musicLinkText;
                if (cfg.musicLinkUrl) document.getElementById('musicLink').href = cfg.musicLinkUrl;
                if (cfg.musicCoverUrl) document.getElementById('musicCover').src = cfg.musicCoverUrl;
            }
        });

        onSnapshot(collection(db, "partners"), (snapshot) => {
            const partnerGroup = document.getElementById('partnerButtonsGroup');
            const partnerWrapper = document.getElementById('partnerSectionWrapper');
            partnerGroup.innerHTML = '';
            
            if (snapshot.empty) {
                partnerWrapper.style.display = 'none';
                return;
            }

            partnerWrapper.style.display = 'flex';
            snapshot.forEach((docSnap) => {
                const p = docSnap.data();
                const a = document.createElement('a');
                a.href = p.url || '#';
                a.target = '_blank';
                a.className = 'partner-btn';
                a.innerText = p.name;
                partnerGroup.appendChild(a);
            });
        });
    </script>
</body>
</html>
